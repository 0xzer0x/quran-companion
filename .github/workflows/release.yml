name: Release
on:
  workflow_dispatch:
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.prepare.outputs.version }}"
      sha: "${{ steps.commit.outputs.sha }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: "${{ secrets.RELEASE_TOKEN }}"

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.14.2

      - name: Bump version and release notes
        id: prepare
        run: |
          VERSION="$(dist/release/prepare)"
          if [[ -z "${VERSION}" ]]; then
            echo "::notice title=Nothing to release::No user-facing changes since the latest tag"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Push release branch
        id: commit
        if: steps.prepare.outputs.version != ''
        env:
          VERSION: "${{ steps.prepare.outputs.version }}"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): v${VERSION}"
          # NOTE: force to allow re-running a release that failed before reaching main
          git push --force origin "HEAD:refs/heads/release/v${VERSION}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs:
      - prepare
    if: needs.prepare.outputs.version != ''
    uses: ./.github/workflows/build.yml
    with:
      ref: "${{ needs.prepare.outputs.sha }}"

  release:
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      APP_VER: "${{ needs.prepare.outputs.version }}"
    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: "${{ needs.prepare.outputs.sha }}"
          token: "${{ secrets.RELEASE_TOKEN }}"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Verify artifacts
        run: |-
          echo "::group::Checking release artifacts"
          if [[ ! -f "Quran_Companion-${{env.APP_VER}}-x86_64.AppImage" || ! -f "Quran_Companion-${{env.APP_VER}}-arm64.dmg" || ! -f "Quran_Companion-${{env.APP_VER}}-x86_64-setup.exe" ]]; then
            echo "::error title=Missing Artifact::One of the platform build artifacts is missing"
            echo -e "Files listing:\n$(ls -la)" >&2
            exit 1
          fi
          echo "::endgroup::"

      - name: Generate attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            Quran_Companion-${{env.APP_VER}}-x86_64.AppImage
            Quran_Companion-${{env.APP_VER}}-arm64.dmg
            Quran_Companion-${{env.APP_VER}}-x86_64-setup.exe

      - name: Generate checksums
        run: |-
          b2sum "Quran_Companion-${{env.APP_VER}}-x86_64.AppImage" > "Quran_Companion-${{env.APP_VER}}-x86_64.AppImage.b2sum"
          b2sum "Quran_Companion-${{env.APP_VER}}-arm64.dmg" > "Quran_Companion-${{env.APP_VER}}-arm64.dmg.b2sum"
          b2sum "Quran_Companion-${{env.APP_VER}}-x86_64-setup.exe" > "Quran_Companion-${{env.APP_VER}}-x86_64-setup.exe.b2sum"

      - name: Extract release notes
        run: awk '/^## \[/ { n++; next } n == 1' CHANGELOG.md > RELEASE_NOTES.md

      - name: Push main and tag
        run: |
          git tag "v${APP_VER}"
          # NOTE: atomic, fails without side effects if main moved since the release started
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v${APP_VER}"

      - name: Release
        uses: ncipollo/release-action@v1.13.0
        with:
          name: "v${{ env.APP_VER }}"
          tag: "v${{ env.APP_VER }}"
          bodyFile: RELEASE_NOTES.md
          artifacts: "Quran_Companion-${{env.APP_VER}}-*"

      - name: Delete release branch
        run: git push origin --delete "release/v${APP_VER}"

  aur:
    needs:
      - prepare
      - release
    runs-on: ubuntu-latest
    environment:
      name: Linux - AUR
      url: https://aur.archlinux.org/packages/quran-companion
    env:
      APP_VER: "${{ needs.prepare.outputs.version }}"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: "${{ needs.prepare.outputs.sha }}"
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            dist/aur/pkgbuildgen.awk
            dist/aur/PKGBUILD.in

      - name: Download AppImage
        uses: actions/download-artifact@v4
        with:
          name: appimage

      - name: Generate PKGBUILD
        run: |
          APPIMAGE_B2SUM="$(b2sum Quran_Companion-${{env.APP_VER}}-x86_64.AppImage | cut -d' ' -f1)"
          awk \
            -v "pkgver=${{ env.APP_VER }}" \
            -v "b2sum=${APPIMAGE_B2SUM}" \
            -f dist/aur/pkgbuildgen.awk \
            dist/aur/PKGBUILD.in > PKGBUILD

      - name: Publish AUR package
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: quran-companion
          pkgbuild: PKGBUILD
          ssh_private_key: "${{ secrets.AUR_KEY }}"
          commit_email: "${{ vars.AUR_EMAIL }}"
          commit_username: "${{ vars.AUR_USERNAME }}"
          commit_message: "release: update to version ${{ env.APP_VER }}"
          ssh_keyscan_types: rsa,ecdsa,ed25519
